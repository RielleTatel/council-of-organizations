[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[[redirects]]
from = "/recweek/map"
to = "/recweek"
status = 301
force = true

[[redirects]]
from = "/sitemap.xml"
to = "/.netlify/functions/sitemap"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
